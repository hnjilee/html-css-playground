<!-- Grid -->

<!-- 요소들을 행과 열을 기준으로 배치하는 2차원 레이아웃 시스템 -->
<!-- 페이지의 전체 구조를 만들 때 주로 사용 -->

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid</title>
    <style>
      body {
        display: flex;
        gap: 20px;
        font-size: 24px;
        font-weight: bold;
      }

      /* 기본 grid-template 적용 */

      .container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-auto-rows: minmax(150px, auto);
        gap: 10px;
        width: 500px;
        height: 500px;
        background-color: blue;
      }

      .item {
        background-color: red;
      }

      .item1 {
        grid-column: 1 / 3;
      }

      .item5 {
        grid-column: -2 / -1;
        grid-row: 2 / span 2;
      }

      /* grid-template-areas 적용 */

      section {
        display: grid;
        grid-template-columns: 2fr 2fr 1fr;
        grid-template-rows: 100px 1fr 1fr 100px;
        grid-template-areas:
          'header header header'
          'main main aside'
          'main main aside'
          'footer footer footer';
        width: 500px;
        height: 500px;
        background-color: blue;
      }

      header {
        grid-area: header;
        background-color: darkturquoise;
      }

      main {
        grid-area: main;
      }

      aside {
        grid-area: aside;
        background-color: hotpink;
      }

      footer {
        grid-area: footer;
        background-color: darkturquoise;
      }
    </style>
  </head>
  <body>
    <!-- 기본 grid-template 적용 -->
    <div class="container">
      <div class="item item1">1</div>
      <div class="item item2">2</div>
      <div class="item item3">3</div>
      <div class="item item4">4</div>
      <div class="item item5">5</div>
      <div class="item item6">6</div>
      <div class="item item7">7</div>
    </div>

    <!-- grid-template-areas 적용 -->
    <section>
      <header>HEADER</header>
      <main>MAIN</main>
      <aside>ASIDE</aside>
      <footer>FOOTER</footer>
    </section>
  </body>
</html>
