<!-- Block vs Inline 차이 -->

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .block {
        width: 100px;
        height: 100px;
        padding: 20px;
        margin: 20px;
        background-color: blue;
      }

      .inline {
        width: 100px;
        height: 100px;
        margin: 10px;
        padding: 10px;
        background-color: red;
      }

      .inline-block {
        display: inline-block;
        width: 50px;
        height: 50px;
        margin: 5px;
        padding: 5px;
        background-color: yellow;
      }
    </style>
  </head>
  <body>
    <!-- 두 줄에 배치됨 -->
    <div>block 요소는 한 줄 전체를 차지하며</div>
    <div>새로운 줄에서 시작함</div>

    <!-- 한 줄에 배치됨 -->
    <span>inline 요소는 콘텐츠 크기만큼 차지하며</span>
    <span>한 줄에 여러 개가 배치됨</span>

    <!-- width/height/padding/margin 모두 적용됨 -->
    <div class="block"></div>

    <!-- padding/좌우 margin만 적용됨 -->
    <span class="inline">콘텐츠</span>

    <!-- 한 줄에 배치됨 -->
    <div class="inline-block"></div>
    <!-- width/height/padding/margin 모두 적용됨 -->
    <span class="inline-block"></span>
  </body>
</html>
