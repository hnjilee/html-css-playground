<!-- Semantic HTML -->

<!-- 의미를 가진 HTML 태그를 사용하여 문서 구조를 표현 -->
<!-- 구조 이해 용이 (가독성, SEO, 접근성) -->

<!-- 주요 태그 사용 예시 -->
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 페이지/섹션의 상단 -->
    <header>
      로고
      <!-- 주요 네비게이션 링크 -->
      <nav>메뉴</nav>
    </header>
    <!-- 주요 콘텐츠 -->
    <main>
      <!-- 주제별 콘텐츠 영역 -->
      <section>
        <!-- 독립적 재사용 가능 콘텐츠 -->
        <article>블로그 글</article>
        <article>블로그 글</article>
        <article>블로그 글</article>
      </section>
    </main>
    <!-- 보조 콘텐츠 -->
    <aside>사이드바</aside>
    <!-- 페이지/섹션의 하단 -->
    <footer>저작권/연락처</footer>
  </body>
</html>
